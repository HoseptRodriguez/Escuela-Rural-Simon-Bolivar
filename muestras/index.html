<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Muestras de voz</title>
<style>
  body { font-family: Verdana, sans-serif; background: #2d1b69; color: #fff8e7; margin: 0; padding: 16px; }
  h1 { font-size: 24px; }
  .voz { display: flex; align-items: center; gap: 16px; background: #fff8e7; color: #111; border: 4px solid #111;
         border-radius: 12px; box-shadow: 6px 6px 0 #111; padding: 12px 16px; margin: 0 0 18px; max-width: 560px; }
  button { font-size: 32px; width: 80px; height: 80px; border: 4px solid #111; border-radius: 12px; background: #7bd389; flex: none; }
  b { font-size: 22px; display: block; } small { font-size: 16px; color: #555; }
</style>
</head>
<body>
<h1>¿Qué voz te gusta más? (ronda 2)</h1>
<p>Toca ▶ para escuchar. Las primeras 5 son voces nuevas que hablan varios idiomas.</p>
<div id="lista"></div>
<script>
  var voces = [
    ['A', 'ava', 'Ava', 'Nueva, muy natural, cálida'],
    ['B', 'emma', 'Emma', 'Nueva, muy natural, alegre'],
    ['C', 'vivienne', 'Vivienne', 'Nueva, natural'],
    ['D', 'seraphina', 'Seraphina', 'Nueva, natural'],
    ['E', 'thalita', 'Thalita', 'Nueva, natural'],
    ['F', 'salome', 'Salomé normal', 'Colombia, sin cambio de tono (para comparar)'],
    ['G', 'dalia', 'Dalia', 'México (para comparar)'],
    ['H', 'ava-en', 'Ava en inglés', 'La misma voz A, hablando inglés'],
    ['I', 'emma-en', 'Emma en inglés', 'La misma voz B, hablando inglés']
  ];
  var lista = document.getElementById('lista'), actual = null;
  voces.forEach(function (v) {
    var d = document.createElement('div'); d.className = 'voz';
    var b = document.createElement('button'); b.textContent = '▶'; b.type = 'button';
    b.onclick = function () { if (actual) actual.pause(); actual = new Audio(v[1] + '.mp3?v=2'); actual.play(); };
    var t = document.createElement('div');
    t.innerHTML = '<b>' + v[0] + '. ' + v[2] + '</b><small>' + v[3] + '</small>';
    d.appendChild(b); d.appendChild(t); lista.appendChild(d);
  });
</script>
</body>
</html>
